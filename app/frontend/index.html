<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self-Healing Cloud Platform</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--ok);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .card-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; }
    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    .btn-primary { background: #0284c7; }
    .btn-warn { background: #d97706; }
    .btn-danger { background: #dc2626; }
    .btn-neutral { background: #475569; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; }
    .status-pill {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: var(--ok);
    }
    #log {
      margin-top: 1.5rem;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      max-height: 200px;
      overflow-y: auto;
      color: var(--muted);
    }
    .log-entry { margin-bottom: 0.35rem; }
    .log-ok { color: var(--ok); }
    .log-warn { color: var(--warn); }
    .log-err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Self-Healing Cloud Platform</h1>
        <p class="subtitle">SRE Observability &amp; Chaos Testing Console</p>
      </div>
      <span id="health-badge" class="badge">Checking health...</span>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">Tracked Services</div>
        <div class="card-value" id="service-count">-</div>
      </div>
      <div class="card">
        <div class="card-label">Simulated Memory</div>
        <div class="card-value" id="memory-mb">0 MB</div>
      </div>
      <div class="card">
        <div class="card-label">Last API Status</div>
        <div class="card-value" id="last-status">-</div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
      <div class="section-title">Chaos Controls</div>
      <div class="actions">
        <button class="btn-primary" onclick="loadItems()">Refresh Services</button>
        <button class="btn-warn" onclick="triggerMemoryChaos()">Simulate Memory Spike (+128 MB)</button>
        <button class="btn-danger" onclick="triggerErrorChaos()">Trigger HTTP 500 Error</button>
        <button class="btn-neutral" onclick="resetChaos()">Reset Chaos State</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Platform Services (<code>/api/items</code>)</div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Service</th>
            <th>Status</th>
            <th>Region</th>
            <th>Latency</th>
          </tr>
        </thead>
        <tbody id="items-body">
          <tr><td colspan="5" style="color: var(--muted);">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const logEl = document.getElementById("log");

    function appendLog(message, level = "ok") {
      const entry = document.createElement("div");
      entry.className = `log-entry log-${level}`;
      const ts = new Date().toLocaleTimeString();
      entry.textContent = `[${ts}] ${message}`;
      logEl.prepend(entry);
    }

    async function checkHealth() {
      const badge = document.getElementById("health-badge");
      try {
        const res = await fetch("/health");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        badge.textContent = `System: ${data.status}`;
      } catch (err) {
        badge.textContent = "System: unreachable";
        badge.style.background = "rgba(239, 68, 68, 0.15)";
        badge.style.color = "#ef4444";
      }
    }

    async function loadItems() {
      try {
        const res = await fetch("/api/items");
        document.getElementById("last-status").textContent = res.status;
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById("service-count").textContent = data.count;
        document.getElementById("memory-mb").textContent = `${data.simulated_memory_mb} MB`;

        const tbody = document.getElementById("items-body");
        tbody.innerHTML = data.items
          .map(
            (item) => `
              <tr>
                <td>${item.id}</td>
                <td><strong>${item.name}</strong></td>
                <td><span class="status-pill">${item.status}</span></td>
                <td>${item.region}</td>
                <td>${item.latency_ms} ms</td>
              </tr>`
          )
          .join("");
        appendLog(`Fetched ${data.count} items from /api/items`, "ok");
      } catch (err) {
        appendLog(`Failed to fetch /api/items: ${err.message}`, "err");
      }
    }

    async function triggerMemoryChaos() {
      try {
        const res = await fetch("/chaos/memory?mb=128", { method: "POST" });
        document.getElementById("last-status").textContent = res.status;
        const data = await res.json();
        document.getElementById("memory-mb").textContent = `${data.total_simulated_memory_mb} MB`;
        appendLog(`Memory chaos triggered (+${data.added_mb} MB, total ${data.total_simulated_memory_mb} MB)`, "warn");
      } catch (err) {
        appendLog(`Memory chaos failed: ${err.message}`, "err");
      }
    }

    async function triggerErrorChaos() {
      try {
        const res = await fetch("/chaos/error", { method: "POST" });
        document.getElementById("last-status").textContent = res.status;
        const data = await res.json();
        appendLog(`Error chaos triggered: HTTP ${res.status} - ${data.detail}`, "err");
      } catch (err) {
        appendLog(`Error chaos request failed: ${err.message}`, "err");
      }
    }

    async function resetChaos() {
      try {
        const res = await fetch("/chaos/reset", { method: "POST" });
        document.getElementById("last-status").textContent = res.status;
        const data = await res.json();
        document.getElementById("memory-mb").textContent = `${data.total_simulated_memory_mb} MB`;
        appendLog("Chaos state reset to 0 MB", "ok");
      } catch (err) {
        appendLog(`Reset failed: ${err.message}`, "err");
      }
    }

    checkHealth();
    loadItems();
  </script>
</body>
</html>
