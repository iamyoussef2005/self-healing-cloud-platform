apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-engine
  namespace: self-healing
  labels:
    app.kubernetes.io/name: remediation-engine
    app.kubernetes.io/part-of: self-healing-cloud-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remediation-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediation-engine
        app.kubernetes.io/part-of: self-healing-cloud-platform
    spec:
      serviceAccountName: remediation-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediation-engine
          image: remediation-engine:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MAX_REPLICAS
              value: "5"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remediation-telegram-secret
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: remediation-telegram-secret
                  key: TELEGRAM_CHAT_ID
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
