apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: self-healing-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: ArgoCD AppProject for the Self-Healing Cloud Platform
  # Restrict to your repository URL in production
  sourceRepos:
    - "*"
  destinations:
    - namespace: app
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
